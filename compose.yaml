services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2025-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in the untracked .env file}"
    ports:
      - "1433:1433"
    volumes:
      - wip-sql-data:/var/opt/mssql

volumes:
  wip-sql-data:
